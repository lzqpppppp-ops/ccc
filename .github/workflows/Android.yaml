      - name: Install Android SDK 35
        shell: bash
        run: |
          SDK_MANAGER=$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools" -path '*/bin/sdkmanager' -type f | sort -V | tail -n 1)
          test -n "$SDK_MANAGER"
          "$SDK_MANAGER" 'platforms;android-35' 'build-tools;35.0.0'
      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: StorageMap-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
